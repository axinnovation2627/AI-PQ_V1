# 평가기준 — 화면(평가기준 편집 / 점수 편집)에서 저장됨. 이전 내용은 backup/ 폴더에 있음
이름: 2026 비탈면·옹벽 정밀안전진단 및 성능평가용역
기산일: 1995.01.05
일수_연환산: 365
정의:
  해당분야: 비탈면·옹벽
  용역유형: {진단성능: 정밀안전진단·성능평가, 점검: 정밀안전점검·긴급안전점검}
  도로유형: {당해분야: 도로법 제10조에 따른 도로, 그외분야: 도로법 제10조에 해당하지 않는 도로}
근거: {기산일: '일반 5: 정밀안전점검, 긴급안전점검, 성능평가 및 정밀안전진단에 대한 경력의 기산일은 관련법령 제정일(1995. 1. 5.) 이후로 한다.', 준공: '세부 2: ''유사용역''·''관련용역''은 준공된 용역에 한한다.', 용역: '세부 1-나 ①: 시설물안전법 제11조~제13조, 제40조에 따른 정밀(긴급)안전점검, 정밀안전진단 및 성능평가 용역', 유사: '세부 1-나 ①: 도로법 제10조의 도로에 대한 절토사면 또는 옹벽을 대상으로 한 경우', 관련: '세부 1-나 ②: 위 용역 중 ①항 이외의 절토사면 또는 옹벽을 대상으로 한 경우(건축분야 제외)', 인정율: '가-2) ③: 유사 — 정밀안전진단·성능평가 100%, 정밀(긴급)안전점검 50% / 관련 — 정밀안전진단·성능평가 60%, 정밀안전점검 30%', 명시: '가-2) ③ ※: 정밀안전점검에 포함하여 실시하는 성능평가의 경우 경력증명서에 성능평가가 명시되지 않은 경우 별도의 용역이행실적 증명서 등 증빙자료 첨부시 인정', 2종증빙: '세부 1-나 ※: 2종 절토사면·옹벽 정밀안전점검은 독립 상태평가 + 관리주체·발주청 발급(확인) 서류 또는 FMS 등재 자료로 2종임이 확인되는 경우만 인정'}
